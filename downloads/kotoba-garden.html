  if(a.word==='たつ'&& !['すわる','ねる','おきる','とぶ','およぐ','ぬぐ','きる','あける','しめる','ひろう','おじぎをする'].includes(b.word))return false;
  if(b.word==='もつ'&&a.word!=='もつ')return false;
 }
 return true;
}
function makeQuestions(kind,round,mode='mix'){
 const all=bank(kind), r=rng((kind==='verb'?321:8751)+round*137), size=all.length;
 const targets=kind==='noun'?nounCourses[round].words:Array.from({length:10},(_,j)=>all[(round*10+j)%size]);
 return targets.map((target,j)=>{const wi=all.indexOf(target),cycle=kind==='noun'?nounCourses[round].cycle:Math.floor((round*10+j)/size);const direction=mode==='mix'?((j+cycle)%2?'picture':'text'):mode;
 const pool=all.filter(w=>isCompatible(target,w,kind));
 const framePool=kind==='verb'?pool.filter(w=>!!w.sequence===!!target.sequence):pool;
 const candidates=framePool.length>=3?framePool:pool;
 const same=shuffle(candidates.filter(w=>w.g===target.g),r),other=shuffle(candidates.filter(w=>w.g!==target.g),r);
 const distract=(kind==='noun'?same:[...same,...other]).slice(0,3);
 if(distract.length!==3)throw new Error('選択肢が不足しています: '+target.word);
 return {target,direction,options:[target,...distract]};
 });
}
// Shuffle once per attempt, never during answer feedback. Avoid the last correct position,
// including across page reloads; copy review questions so earlier attempts stay intact.
function prepareQuestions(questions){
 saved.lastAnswerPositions=saved.lastAnswerPositions||{};
 const prepared=questions.map(q=>{const options=shuffle(q.options),key=state.kind+'-'+q.direction+'-'+q.target.id;
 const previous=saved.lastAnswerPositions[key];let at=options.findIndex(w=>w.id===q.target.id);
 if(at===previous){const next=(at+1+Math.floor(Math.random()*3))%4;[options[at],options[next]]=[options[next],options[at]];at=next}
 saved.lastAnswerPositions[key]=at;return {...q,options};});
 persist();return prepared;
}
function done(k){return Object.keys(saved.scores).filter(x=>x.startsWith(k+'-')).length}
function render(){app.innerHTML=state.page==='home'?homeHTML():state.page==='rounds'?roundsHTML():state.page==='quiz'?quizHTML():resultHTML();window.scrollTo({top:0,behavior:'instant'})}
function homeHTML(){return `<section class="intro"><div><div class="eyebrow">え と おと で、にほんご。</div><h1>きょうは なにを<br>おぼえよう？</h1><p>みて、きいて、えらんでみよう。<br>10もんずつ、じぶんの ペースで。</p></div><div class="mascot-scene" aria-hidden="true"><span class="sun">✳</span><div class="cloud"></div><div class="hill"></div><div class="mascot"><span class="leaf"></span></div><span class="sprout">🌱</span><div class="bubble">いっしょに やろう！</div></div></section><div class="section-label">すきな ことばを えらぼう</div><section class="path-cards"><button class="path-card" data-action="rounds" data-kind="verb"><div class="card-top"><span class="pill">うごき · 30コース</span></div><div class="card-art">${VERBS[2].art}</div><h2>うごきのことば</h2><p class="card-desc">たべる・あるく・あそぶ</p><div class="card-bottom"><span>1コース 10もん　 ·　${done('verb')} / 30 おわり</span><span class="go">↗</span></div></button><button class="path-card noun" data-action="rounds" data-kind="noun"><div class="card-top"><span class="pill">もの · 60コース</span></div><div class="card-art noun-art" aria-hidden="true"><span>🍎</span><span>✏️</span><span>🐱</span><span>🌷</span></div><h2>もののことば</h2><p class="card-desc">りんご・えんぴつ・ねこ</p><div class="card-bottom"><span>1コース 10もん　 ·　${done('noun')} / 60 おわり</span><span class="go">↗</span></div></button></section><section class="help-strip"><div class="help-row"><span class="help-icon">♫</span><div><strong>おとを きいてみよう</strong><p>♫ を おすと、にほんごが きこえるよ。</p></div></div><button class="sound-large" data-action="soundtest">♫ おとを ためす</button></section><div class="stats-row"><span>🌱 おわった コース <strong>${done('verb')+done('noun')}</strong> / 90</span><span>✦ まちがえても だいじょうぶ</span></div>${!storageOK?'<p class="notice">この ブラウザでは きろくが のこりません。</p>':''}`}
function roundCard(k,i){const score=saved.scores[k+'-'+i],course=k==='noun'?nounCourses[i]:null;return `<button class="round ${score?'done':''}" data-action="start" data-round="${i}" aria-label="${course?esc(course.g)+'、':''}コース ${i+1}${score?'、'+score.best+'もん せいかい':''}"><small>コース</small><span class="num">${String(i+1).padStart(2,'0')}</span><small>${course?(course.cycle===0?'はじめの れんしゅう':'もういちど れんしゅう'):'うごきを おぼえよう'}</small><div class="stars">${score?`${score.best===10?'✦ ✦ ✦':'✓'}　${score.best}/10`:'· · ·'}</div></button>`}
function roundsHTML(){const k=state.kind;const cards=k==='verb'?`<div class="round-grid">${Array.from({length:total(k)},(_,i)=>roundCard(k,i)).join('')}</div>`:[...new Set(nounCourses.map(c=>c.g))].map(g=>`<section class="noun-category"><h3>${esc(g)}</h3><p class="category-words">${NOUNS.filter(w=>w.g===g).slice(0,4).map(w=>esc(w.word)).join('・')} など</p><div class="round-grid">${nounCourses.map((c,i)=>c.g===g?roundCard(k,i):'').join('')}</div></section>`).join('');
return `<button class="back" data-action="home">← はじめに もどる</button><div class="page-head"><div><div class="eyebrow">${k==='verb'?'🌿':'🍎'} ことばを そだてよう</div><h2>${label(k)}</h2><p>${k==='noun'?'なかまを えらんでから、れんしゅうしよう。':'コースを えらんでね。どこからでも はじめられるよ。'}</p></div><span class="round-count">${done(k)} / ${total(k)} おわり</span></div><div class="mode-bar" aria-label="もんだいの かたち">${[['mix','まぜて れんしゅう'],['text','え → ことば'],['picture','ことば → え']].map(([m,l])=>`<button data-action="mode" data-mode="${m}" class="${state.mode===m?'active':''}" aria-pressed="${state.mode===m}">${l}</button>`).join('')}</div>${cards}<p class="course-note">${k==='verb'?'100この ことばを、3かいずつ れんしゅうするよ。':'300この ことばを、なかまごとに 2かいずつ れんしゅうするよ。'}<br>きろくは この ブラウザに のこるよ。</p>`}
function start(round,reviewQuestions){state.round=round;state.page='quiz';state.index=0;state.answers=[];state.locked=false;state.review=!!reviewQuestions;state.questions=prepareQuestions(reviewQuestions||makeQuestions(state.kind,round,state.mode));render();autoSpeak()}
function autoSpeak(){if(saved.auto&&state.page==='quiz'){const q=state.questions[state.index];speak(q.direction==='picture'?q.target.word:'えに あう ことばを えらぼう')}}
function quizHTML(){const q=state.questions[state.index],pic=q.direction==='picture',instruction=pic?'ことばに あう えを えらぼう':'えに あう ことばを えらぼう';const answer=state.answers[state.index];const hasSequence=pic?q.options.some(w=>w.sequence):q.target.sequence;return `<div class="quiz-top"><button class="back" data-action="exit">← コース</button><div class="progress" role="progressbar" aria-label="すすみぐあい" aria-valuemin="0" aria-valuemax="${state.questions.length}" aria-valuenow="${state.index}"><div style="width:${state.index/state.questions.length*100}%"></div></div><span>${state.index+1} / ${state.questions.length}</span></div><h2 class="question-title">${instruction}${sound(instruction,'もんだいの せつめいを きく')}</h2>${hasSequence?'<p class="sequence-hint">1 → 2 の じゅんに みてね</p>':''}<div class="prompt-card">${pic?`<span class="word">${q.target.word}</span>${sound(q.target.word,'もんだいの ことばを きく')}`:scene(q.target)}</div><div class="choices">${q.options.map((w,i)=>{const cls=answer?(w.id===q.target.id?'correct':w.id===answer.chosen?'wrong':'dim'):'';return `<div class="choice ${pic?'picture':''} ${cls}"><button class="answer" data-action="answer" data-id="${w.id}" ${state.locked?'disabled':''} aria-label="${pic?'え '+(i+1):w.word}"><span class="index">${i+1}</span>${pic?scene(w):esc(w.word)}</button>${!pic?sound(w.word,`${i+1}ばんの ことばを きく`):''}</div>`}).join('')}</div>${answer?`<div class="feedback ${answer.correct?'good':'try'}" role="status"><div><strong>${answer.correct?'◎ せいかい！':'もう ひといき！'}</strong><small>こたえは「${q.target.word}」${q.target.note?' · '+q.target.note:''}</small></div>${sound(q.target.note||q.target.word,'こたえを きく')}<button class="primary" data-action="next">${state.index===state.questions.length-1?'けっかを みる':'つぎへ'} →</button></div>`:'<div class="feedback"><small style="color:var(--muted);margin:auto">'+(pic?'えを おして えらんでね。':'♫ で きいてから えらんでも いいよ。')+'</small></div>'}`}
function answer(id){if(state.locked)return;const q=state.questions[state.index];if(!q.options.some(w=>w.id===id))return;state.answers.push({chosen:id,correct:id===q.target.id});state.locked=true;render();if(saved.auto)speak(id===q.target.id?'せいかい。'+q.target.word:'こたえは、'+q.target.word)}
function next(){if(!state.locked)return;if(state.index<state.questions.length-1){state.index++;state.locked=false;render();autoSpeak()}else{if(!state.review){const score=state.answers.filter(a=>a.correct).length,key=state.kind+'-'+state.round;const old=saved.scores[key];saved.scores[key]={best:Math.max(old?.best||0,score),last:score,attempts:(old?.attempts||0)+1,date:new Date().toISOString()};persist()}state.page='result';render()}}
function resultHTML(){const score=state.answers.filter(a=>a.correct).length,miss=state.answers.length-score;return `<section class="result"><div class="eyebrow">${state.review?'もういちど れんしゅう':'コース '+(state.round+1)} おわり！</div><div class="result-plant" aria-hidden="true">${score===state.questions.length?'🌻':'🌱'}</div><h1>${score===state.questions.length?'ぜんぶ できたね！':'よく がんばったね！'}</h1><div class="score">${score}<small> / ${state.questions.length} もん</small></div><p>きょうも ことばが ふえたね。</p><div class="result-actions">${miss?'<button class="primary" data-action="review">まちがえた もんだいを もういちど</button>':!state.review&&state.round+1<total(state.kind)?'<button class="primary" data-action="nextRound">つぎの コースへ →</button>':''}<button class="secondary" data-action="retry">もういちど</button><button class="secondary" data-action="rounds">コースに もどる</button></div><div class="section-label">れんしゅうした ことば</div><div class="result-list">${state.questions.map((q,i)=>`<div class="mini-word"><span class="status-dot">${state.answers[i].correct?'◎ できた':'↻ もういちど'}</span>${scene(q.target)}<p>${q.target.word}</p>${sound(q.target.note||q.target.word)}</div>`).join('')}</div></section>`}
